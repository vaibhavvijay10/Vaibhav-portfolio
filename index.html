          "name": "How can I reduce Customer Acquisition Cost (CAC) for a startup?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "To reduce CAC, focus on five levers in this order: (1) improve creative and landing page conversion rate before spending more — a 30 percent CRO lift cuts effective CAC by 30 percent at zero added spend; (2) audit attribution to find channels with inflated CAC due to last-click bias; (3) reactivate dormant users — reactivation typically costs one fifth of fresh acquisition; (4) shift budget toward retention to grow LTV, which makes a higher CAC sustainable; (5) build organic and referral loops so a chunk of acquisition has zero marginal cost. Most teams jump to point five before doing one through four, which is backwards."
          }

          "@type": "Question",

          "acceptedAnswer": {

          }

          }

          }

            "@type": "Answer",
            "text": "To improve Apple Search Ads ROAS, structure campaigns into four types: (1) Brand defense — bid on your own brand keywords, very high ROAS, low spend; (2) Generic discovery — broad match on category keywords with auto-targeting, lets Apple find new keyword candidates; (3) Competitor — bid on competitor brand names where ToS allows, watch CPI carefully; (4) Exact match scaling — promote winning keywords from discovery into dedicated exact-match campaigns. Optimize at the keyword level for tap-through rate (above 0.7 percent is healthy) and conversion rate (above 50 percent for branded, 30 percent for generic). Pair ASA with strong store-listing CRO; you cannot out-bid a weak listing."
          }
